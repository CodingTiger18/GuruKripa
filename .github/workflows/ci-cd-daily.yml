name: GuruKripa CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily at 2:00 AM IST (Indian Standard Time, UTC +5:30)
    # 2:00 AM IST minus 5 hours 30 minutes = 20:30 UTC of previous day
    # Cron format: minute (30), hour (20), day (*), month (*), weekday (*)
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-test-build:
    name: Verify, Test & Build GuruKripa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Security Supply-Chain Audit
        run: npm audit --audit-level=high

      - name: Execute Automated Test Suites
        run: npm test

      - name: Refresh Daily SEO Sitemap Timestamps
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>${TODAY}<\/lastmod>/g" public/sitemap.xml
          echo "Updated sitemap.xml timestamps to ${TODAY}"

      - name: Build Clean Production Bundle
        run: npm run build

      - name: Verify Clean Production Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/_headers || exit 1
          test -f dist/robots.txt || exit 1
          test -f dist/ads.txt || exit 1
          echo "All production distribution files verified cleanly."

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: gurukripa-dist
          path: dist/
          retention-days: 7

  deploy-cloudflare:
    name: Atomic Deployment to Cloudflare Pages ($0/mo)
    needs: audit-test-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: gurukripa-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gurukripa --branch=main
        continue-on-error: true # Graceful if tokens not yet configured in GitHub Secrets
